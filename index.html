<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Luyện Nói Tiếng Anh - 40 Câu Chuẩn Thứ Tự (Đọc Siêu Chậm & Rõ Chữ)</title>
  <style>
    :root {
      --bg-dark: #080c14;
      --card-bg: #111827;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --highlight: #facc15;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .app-header {
      width: 100%;
      max-width: 1040px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #6366f1, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-selector {
      display: flex;
      gap: 5px;
      background: rgba(255,255,255,0.06);
      padding: 4px;
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .sec-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    .sec-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* Player Container */
    .player-card {
      width: 100%;
      max-width: 1040px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      min-height: 500px;
      background: radial-gradient(circle at 50% 15%, #1e293b 0%, #090e1a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 40px;
      overflow: hidden;
    }

    .viewport-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge-counter {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.45);
      color: #c7d2fe;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--warning);
      font-weight: 600;
    }

    .status-badge.speaking {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
    }

    .status-badge.speaking-word {
      color: var(--highlight);
      border-color: rgba(250, 204, 21, 0.5);
      background: rgba(250, 204, 21, 0.12);
    }

    .status-badge.your-turn {
      color: var(--accent);
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--accent-glow);
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Content Area */
    .viewport-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 20px;
      z-index: 2;
      width: 100%;
      padding: 6px 0;
    }

    .question-block {
      max-width: 920px;
      width: 100%;
    }

    .tag-header {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tag-q { color: #f43f5e; }
    .tag-a { color: var(--accent); }

    /* Word highlighting / Karaoke */
    .word {
      display: inline-block;
      padding: 2px 4px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .word.active {
      background: var(--highlight);
      color: #000 !important;
      font-weight: 900 !important;
      transform: scale(1.15);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.85);
    }

    .q-en {
      font-size: 1.95rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .ipa-text {
      font-size: 1.02rem;
      color: #38bdf8;
      font-family: 'Consolas', 'Courier New', monospace;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .q-vi {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .answer-block {
      width: 100%;
      max-width: 920px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 6px solid var(--accent);
      border-radius: 14px;
      padding: 16px 24px;
      text-align: left;
      transition: all 0.35s ease;
    }

    .answer-block.dimmed {
      opacity: 0.15;
      filter: blur(4px);
    }

    .a-en {
      font-size: 1.6rem;
      font-weight: 700;
      color: #a7f3d0;
      line-height: 1.35;
    }

    .a-vi {
      font-size: 1.02rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* Countdown overlay */
    .countdown-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      color: var(--warning);
      font-weight: 700;
      background: rgba(0,0,0,0.4);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .countdown-number {
      font-size: 1.55rem;
      font-weight: 900;
      color: #fbbf24;
    }

    /* Progress timeline */
    .timeline-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
    }

    .timeline-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.25s linear;
    }

    /* Controls bar */
    .controls-bar {
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #334155;
      border-color: rgba(255,255,255,0.25);
    }

    .btn-primary {
      background: var(--primary);
      border-color: transparent;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-accent {
      background: #065f46;
      border-color: rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
    }

    .btn-accent:hover {
      background: #047857;
    }

    .btn-warning {
      background: #78350f;
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .btn-warning:hover {
      background: #92400e;
    }

    .select-dropdown {
      background: #1e293b;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
    }

    /* Jump to question */
    .jump-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* List Tab */
    .list-view {
      display: none;
      width: 100%;
      max-width: 1040px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 24px;
    }

    .list-item {
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .list-item:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .list-item-num {
      font-weight: 800;
      color: var(--primary-light);
      font-size: 1.15rem;
      min-width: 50px;
    }

    .list-item-body {
      flex: 1;
    }

    .list-item-q {
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
    }

    .list-item-a {
      font-size: 0.95rem;
      color: #a7f3d0;
      margin-top: 4px;
      font-weight: 600;
    }

    .play-btn-circle {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .q-en { font-size: 1.4rem; }
      .a-en { font-size: 1.2rem; }
      .video-viewport { padding: 18px; min-height: 420px; }
      .controls-bar { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="app-title">
      <span>🎓🐢</span> Video Luyện Nói Tiếng Anh (Đầy Đủ 40 Câu Chuẩn Thứ Tự)
    </div>
    
    <!-- Section Navigation -->
    <div class="section-selector">
      <button class="sec-btn active" id="secBtnAll" onclick="filterRange('all')">📚 Tất Cả (40 Câu)</button>
      <button class="sec-btn" id="secBtnP1" onclick="filterRange('p1')">📘 Câu 1 - 12</button>
      <button class="sec-btn" id="secBtnP2" onclick="filterRange('p2')">📙 Câu 13 - 29</button>
      <button class="sec-btn" id="secBtnP3" onclick="filterRange('p3')">📗 Câu 30 - 40</button>
      <button class="sec-btn" id="secBtnList" onclick="toggleViewMode()">📋 Xem Toàn Bộ</button>
    </div>
  </header>

  <!-- Video Player Section -->
  <div class="player-card" id="videoSection">
    <div class="video-viewport" id="viewport">
      
      <!-- Top header in video -->
      <div class="viewport-top">
        <div class="badge-counter" id="slideBadge">Câu 1 / 40</div>
        <div class="status-badge" id="statusBadge">
          <span class="dot-pulse"></span>
          <span id="statusText">Sẵn sàng học</span>
        </div>
        <div class="countdown-indicator" id="countdownBox" style="display: none;">
          <span id="countdownLabel">Lượt bạn nói:</span>
          <span class="countdown-number" id="countdownSec">4</span>s
        </div>
      </div>

      <!-- Center content: Question & Answer with Word Highlight -->
      <div class="viewport-content">
        <div class="question-block">
          <div class="tag-header tag-q">
            <span>🔴 QUESTION (CÂU HỎI)</span>
          </div>
          <div class="q-en" id="qText"></div>
          <div class="ipa-text" id="qIpaText"></div>
          <div class="q-vi" id="qViText"></div>
        </div>

        <div class="answer-block dimmed" id="answerBlock">
          <div class="tag-header tag-a" style="justify-content: flex-start;">
            <span>🟢 MODEL ANSWER (CÂU TRẢ LỜI MẪU)</span>
          </div>
          <div class="a-en" id="aText"></div>
          <div class="ipa-text" id="aIpaText"></div>
          <div class="a-vi" id="aViText"></div>
        </div>
      </div>

      <div></div>
    </div>

    <!-- Timeline Progress -->
    <div class="timeline-container" onclick="handleTimelineClick(event)">
      <div class="timeline-progress" id="progressBar"></div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="control-group">
        <button class="btn" onclick="prevSlide()">⏮ Trước</button>
        <button class="btn btn-primary" id="btnPlayPause" onclick="togglePlayPause()">
          ▶ Phát Video Tự Động
        </button>
        <button class="btn" onclick="nextSlide()">Sau ⏭</button>
      </div>

      <!-- Pronunciation Controls -->
      <div class="control-group">
        <button class="btn btn-warning" onclick="speakWordByWord('q')" title="Đọc ngắt từng từ một cực kỳ rõ ràng">
          🐢 Đọc Từng Chữ (Câu Hỏi)
        </button>
        <button class="btn btn-accent" onclick="speakWordByWord('a')" title="Đọc ngắt từng từ một cực kỳ rõ ràng">
          🐢 Đọc Từng Chữ (Đáp Án)
        </button>
      </div>

      <div class="control-group">
        <div class="jump-box">
          <span style="font-size: 0.88rem; color: #94a3b8;">Đến câu:</span>
          <select class="select-dropdown" id="jumpSelect" onchange="jumpTo(this.value)">
          </select>
        </div>

        <label for="speedSelect" style="font-size: 0.88rem; color: #94a3b8;">Tốc độ:</label>
        <select class="select-dropdown" id="speedSelect">
          <option value="0.6" selected>0.60x (Siêu chậm)</option>
          <option value="0.75">0.75x (Chậm & rõ)</option>
          <option value="0.9">0.90x (Vừa phải)</option>
          <option value="1.0">1.0x (Chuẩn bản xứ)</option>
        </select>

        <button class="btn" id="btnToggleIpa" onclick="toggleIpa()">🔤 IPA</button>
        <button class="btn" id="btnToggleTrans" onclick="toggleTranslation()">🌐 Dịch TV</button>
      </div>
    </div>
  </div>

  <!-- List View Section -->
  <div class="list-view" id="listSection">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="font-size: 1.25rem; color: var(--primary-light);">
        Toàn Bộ 40 Câu Hỏi & Câu Trả Lời (Có Phiên Âm IPA & Dịch Nghĩa)
      </h2>
      <button class="btn btn-primary" onclick="toggleViewMode()">📺 Quay Lại Video</button>
    </div>
    <div id="listContainer"></div>
  </div>

  <script>
    // TOÀN BỘ 40 CÂU HỎI THEO ĐÚNG THỨ TỰ CỦA NGƯỜI HỌC
    const allData = [
      // --- PHẦN 1: CÂU 1 - 12 ---
      {
        id: 1,
        q: "Do you have a job or are you a student?",
        qIpa: "/duː juː hæv ə dʒɒb ɔːr ɑːr juː ə ˈstjuːdnt/",
        qVi: "Bạn đã đi làm hay là học sinh/sinh viên?",
        a: "I'm a student.",
        aIpa: "/aɪm ə ˈstjuːdnt/",
        aVi: "Tôi là sinh viên."
      },
      {
        id: 2,
        q: "How do you usually get to your university?",
        qIpa: "/haʊ duː juː ˈjuːʒuəli ɡet tuː jɔːr ˌjuːnɪˈvɜːrsəti/",
        qVi: "Bạn thường đến trường đại học bằng phương tiện gì?",
        a: "I usually get to my university by bus.",
        aIpa: "/aɪ ˈjuːʒuəli ɡet tuː maɪ ˌjuːnɪˈvɜːrsəti baɪ bʌs/",
        aVi: "Tôi thường đến trường bằng xe buýt. (by + phương tiện)"
      },
      {
        id: 3,
        q: "When did you start to learn English?",
        qIpa: "/wen dɪd juː stɑːrt tuː lɜːrn ˈɪŋɡlɪʃ/",
        qVi: "Bạn bắt đầu học tiếng Anh từ khi nào?",

        aIpa: "/aɪ ˈstɑːrtɪd ˈlɜːrnɪŋ ˈɪŋɡlɪʃ faɪv jɪərz əˈɡoʊ/",
        aVi: "Tôi bắt đầu học tiếng Anh từ 5 năm trước. (started: quá khứ)"
      },
      {
        id: 4,
        q: "Do you like it? Why? Why not?",
        qIpa: "/duː juː laɪk ɪt? waɪ? waɪ nɒt/",
        qVi: "Bạn có thích nó không? Tại sao?",
        a: "Yes, I do. Because it is very interesting and useful.",
        aIpa: "/jes, aɪ duː. bɪˈkəz ɪt ɪz ˈveri ˈɪntrəstɪŋ ænd ˈjuːsfəl/",

      },
      {
        id: 5,

        qIpa: "/tel miː ˈsʌmθɪŋ əˈbaʊt jɔːr plænz ɪn ðə ˈfjuːtʃər/",
        qVi: "Hãy chia sẻ về các kế hoạch tương lai của bạn?",
        a: "In the future, I will find a good job, buy a car, and get married.",
        aIpa: "/ɪn ðə ˈfjuːtʃər, aɪ wɪl faɪnd ə ɡʊd dʒɒb, baɪ ə kɑːr, ænd ɡet ˈmærid/",
        aVi: "Trong tương lai, tôi sẽ tìm việc tốt, mua xe và lập gia đình."
      },
      {
        id: 6,
        q: "What are your hobbies?",
        qIpa: "/wɒt ɑːr jɔːr ˈhɒbiz/",
        qVi: "Sở thích của bạn là gì?",
        a: "I like reading books and playing video games.",
        aIpa: "/aɪ laɪk ˈriːdɪŋ bʊks ænd ˈpleɪɪŋ ˈvɪdioʊ ɡeɪmz/",
        aVi: "Tôi thích đọc sách và chơi trò chơi điện tử. (like + V-ing)"
      },
      {
        id: 7,
        q: "Do you like video games? Why? Why not?",
        qIpa: "/duː juː laɪk ˈvɪdioʊ ɡeɪmz? waɪ? waɪ nɒt/",
        qVi: "Bạn có thích trò chơi điện tử không? Tại sao?",
        a: "Yes, I do. Because they are interesting and help me relax.",
        aIpa: "/jes, aɪ duː. bɪˈkəz ðeɪ ɑːr ˈɪntrəstɪŋ ænd help miː rɪˈlæks/",
        aVi: "Có, tôi thích. Vì game rất thú vị và giúp tôi thư giãn."
      },
      {
        id: 8,
        q: "Do you think video games are bad for children? Why?",
        qIpa: "/duː juː θɪŋk ˈvɪdioʊ ɡeɪmz ɑːr bæd fɔːr ˈtʃɪldrən? waɪ/",
        qVi: "Bạn có nghĩ video game có hại cho trẻ em không? Tại sao?",
        a: "Yes, I do. Because children can easily become addicted to games.",
        aIpa: "/jes, aɪ duː. bɪˈkəz ˈtʃɪldrən kæn ˈiːzəli bɪˈkʌm əˈdɪktɪd tuː ɡeɪmz/",
        aVi: "Có. Vì trẻ em rất dễ bị nghiện game."
      },
      {
        id: 9,
        q: "Where did you go on your last holiday?",
        qIpa: "/weər dɪd juː ɡoʊ ɒn jɔːr læst ˈhɒlədeɪ/",
        qVi: "Kỳ nghỉ trước bạn đã đi đâu?",
        a: "On my last holiday, I went to Sam Son beach with my family.",
        aIpa: "/ɒn maɪ læst ˈhɒlədeɪ, aɪ went tuː Sam Son biːtʃ wɪð maɪ ˈfæməli/",
        aVi: "Vào kỳ nghỉ trước, tôi đã đi biển Sầm Sơn cùng gia đình."
      },
      {

    function populateJumpSelect() {
      jumpSelect.innerHTML = '';
      currentList.forEach((item, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `Câu ${item.id}: ${item.q.substring(0, 32)}...`;
        jumpSelect.appendChild(opt);
      });
    }

    function jumpTo(idx) {
      pauseIfPlaying();
      currentIndex = parseInt(idx);
      renderSlide(currentIndex, true);
    }

    function filterRange(type) {
      pauseIfPlaying();
      document.querySelectorAll('.sec-btn').forEach(b => b.classList.remove('active'));

      if (type === 'p1') {
        currentList = allData.slice(0, 12);
        document.getElementById('secBtnP1').classList.add('active');
      } else if (type === 'p2') {
        currentList = allData.slice(12, 29);
        document.getElementById('secBtnP2').classList.add('active');
      } else if (type === 'p3') {
        currentList = allData.slice(29, 40);
        document.getElementById('secBtnP3').classList.add('active');
      } else {
        currentList = allData;
        document.getElementById('secBtnAll').classList.add('active');
      }

      currentIndex = 0;
      populateJumpSelect();
      renderSlide(currentIndex, true);
      buildList();
    }

    function wrapWords(text, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const words = text.split(/\s+/);
      words.forEach((w, idx) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.dataset.wordIndex = idx;
        span.textContent = w + ' ';
        container.appendChild(span);
      });
    }

    function clearHighlight(containerId) {
      const spans = document.getElementById(containerId).querySelectorAll('.word');
      spans.forEach(s => s.classList.remove('active'));
    }

    function highlightWord(containerId, wordIdx) {
      const spans = document.getElementById(containerId).querySelectorAll('.word');
      spans.forEach((s, idx) => {
        if (idx === wordIdx) {
          s.classList.add('active');
        } else {
          s.classList.remove('active');
        }
      });
    }

    function setStatus(text, type = '') {
      statusText.textContent = text;
      statusBadge.className = 'status-badge ' + type;
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Đọc Karaoke từng chữ
    function speakWithKaraoke(text, containerId, rate = 0.6) {
      return new Promise((resolve) => {
        window.speechSynthesis.cancel();
        clearHighlight(containerId);

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = rate;

        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Jenny') || v.name.includes('Samantha') || v.name.includes('David')));
        if (enVoice) utterance.voice = enVoice;

        let wordIndex = 0;
        utterance.onboundary = (event) => {
          if (event.name === 'word') {
            highlightWord(containerId, wordIndex);
            wordIndex++;
          }
        };

        utterance.onend = () => {
          clearHighlight(containerId);
          resolve();
        };

        utterance.onerror = () => {
          clearHighlight(containerId);
          resolve();
        };

        window.speechSynthesis.speak(utterance);
      });
    }

    // Đọc tách từng từ cực chậm và rõ ràng
    async function speakWordByWord(type) {
      pauseIfPlaying();
      const currentRun = ++runId;
      const text = (type === 'q') ? currentList[currentIndex].q : currentList[currentIndex].a;
      const containerId = (type === 'q') ? 'qText' : 'aText';
      
      if (type === 'a') {
        answerBlock.classList.remove('dimmed');
      }

      setStatus(`🐢 Đang đọc tách từng từ (${type === 'q' ? 'Câu hỏi' : 'Đáp án'})...`, 'speaking-word');
      clearHighlight(containerId);

      const words = text.split(/\s+/);
      for (let i = 0; i < words.length; i++) {
        if (currentRun !== runId) return;
        highlightWord(containerId, i);
        
        await new Promise((resolve) => {
          const u = new SpeechSynthesisUtterance(words[i]);
          u.lang = 'en-US';
          u.rate = 0.65;
          u.onend = () => resolve();
          u.onerror = () => resolve();
          window.speechSynthesis.speak(u);
        });

        await delay(500);
      }

      clearHighlight(containerId);
      setStatus("Sẵn sàng học", "");
    }

    async function countdown(seconds, label) {
      countdownBox.style.display = 'flex';
      countdownLabel.textContent = label;
      setStatus(label, 'your-turn');
      for (let i = seconds; i > 0; i--) {
        countdownSec.textContent = i;
        await delay(1000);
      }
      countdownBox.style.display = 'none';
    }

    function renderSlide(index, showAnswer = false) {
      const item = currentList[index];
      wrapWords(item.q, 'qText');
      wrapWords(item.a, 'aText');

      qIpaText.textContent = item.qIpa;
      qViText.textContent = item.qVi;
      aIpaText.textContent = item.aIpa;
      aViText.textContent = item.aVi;

      slideBadge.textContent = `Câu ${item.id} / 40 (${index + 1} trong danh sách)`;
      jumpSelect.value = index;
      progressBar.style.width = `${((index + 1) / currentList.length) * 100}%`;

      if (showAnswer) {
        answerBlock.classList.remove('dimmed');
      } else {
        answerBlock.classList.add('dimmed');
      }
    }

    async function playVideoStep() {
      const currentRun = ++runId;

      while (isPlaying && currentIndex < currentList.length) {
        if (currentRun !== runId) return;
        const item = currentList[currentIndex];
        const rate = parseFloat(speedSelect.value);

        // 1. Hiện câu hỏi và đọc siêu chậm
        renderSlide(currentIndex, false);
        setStatus("🎧 Lắng nghe & theo dõi từng chữ...", "speaking");
        await speakWithKaraoke(item.q, 'qText', rate);
        if (currentRun !== runId || !isPlaying) return;

        // 2. Chờ 4 giây để người học phản xạ
        await countdown(4, "🗣 Lượt của bạn: Tự trả lời!");
        if (currentRun !== runId || !isPlaying) return;

        // 3. Hiện câu trả lời mẫu & đọc siêu chậm
        renderSlide(currentIndex, true);
        setStatus("🔊 Đáp án mẫu (Đọc chậm & rõ)...", "speaking");
        await speakWithKaraoke(item.a, 'aText', rate);
        if (currentRun !== runId || !isPlaying) return;

        // 4. Cho 4 giây để Shadowing (nhại theo)
        await countdown(4, "🎙 Nhại lại theo giọng đọc...");
        if (currentRun !== runId || !isPlaying) return;

        // 5. Chuyển sang câu tiếp
        if (currentIndex < currentList.length - 1) {
          currentIndex++;
        } else {
          setStatus("🎉 Đã hoàn thành toàn bộ câu!", "");
          isPlaying = false;
          btnPlayPause.textContent = "▶ Phát lại từ đầu";
          currentIndex = 0;
          break;
        }
      }
    }

    function togglePlayPause() {
      if (isPlaying) {
        pauseIfPlaying();
      } else {
        isPlaying = true;
        btnPlayPause.textContent = "⏸ Tạm dừng";
        playVideoStep();
      }
    }

    function pauseIfPlaying() {
      isPlaying = false;
      runId++;
      window.speechSynthesis.cancel();
      btnPlayPause.textContent = "▶ Phát Video Tự Động";
      countdownBox.style.display = 'none';
      clearHighlight('qText');
      clearHighlight('aText');
      setStatus("Sẵn sàng học", "");
    }

    function nextSlide() {
      pauseIfPlaying();
      if (currentIndex < currentList.length - 1) {
        currentIndex++;
        renderSlide(currentIndex, true);
      }
    }

    function prevSlide() {
      pauseIfPlaying();
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex, true);
      }
    }

    function toggleIpa() {
      showIpa = !showIpa;
      qIpaText.style.display = showIpa ? 'block' : 'none';
      aIpaText.style.display = showIpa ? 'block' : 'none';
    }

    function toggleTranslation() {
      showTranslation = !showTranslation;
      qViText.style.display = showTranslation ? 'block' : 'none';
      aViText.style.display = showTranslation ? 'block' : 'none';
    }

    function handleTimelineClick(e) {
      pauseIfPlaying();
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clickX / rect.width;
      currentIndex = Math.floor(ratio * currentList.length);
      renderSlide(currentIndex, true);
    }

    function toggleViewMode() {
      const vSec = document.getElementById('videoSection');
      const lSec = document.getElementById('listSection');
      if (vSec.style.display === 'none') {
        vSec.style.display = 'flex';
        lSec.style.display = 'none';
      } else {
        pauseIfPlaying();
        vSec.style.display = 'none';
        lSec.style.display = 'block';
      }
    }

    function buildList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      allData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div class="list-item-num">#${item.id}</div>
          <div class="list-item-body">
            <div class="list-item-q">${item.q}</div>
            <div style="font-size: 0.85rem; color: #38bdf8; font-family: monospace;">${item.qIpa}</div>
            <div style="font-size: 0.88rem; color: #94a3b8;">${item.qVi}</div>
            <div class="list-item-a">👉 ${item.a}</div>
            <div style="font-size: 0.85rem; color: #6ee7b7; font-family: monospace;">${item.aIpa}</div>
          </div>
          <button class="play-btn-circle" onclick="playSingleItem(${item.id - 1}, event)">▶</button>
        `;
        div.addEventListener('click', () => {
          toggleViewMode();
          currentIndex = item.id - 1;
          renderSlide(currentIndex, true);
        });
        container.appendChild(div);
      });
    }

    function playSingleItem(idx, e) {
      e.stopPropagation();
      toggleViewMode();
      currentIndex = idx;
      renderSlide(currentIndex, true);
      const rate = parseFloat(speedSelect.value);
      speakWithKaraoke(allData[idx].q, 'qText', rate).then(() => {
        speakWithKaraoke(allData[idx].a, 'aText', rate);
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowRight') {
        nextSlide();
      } else if (e.code === 'ArrowLeft') {
        prevSlide();
      }
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Khởi chạy
    populateJumpSelect();
    renderSlide(0, true);
    buildList();
  </script>
</body>
</html>
